name: Build and test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # The signing key isn't in the repo, so CI builds debug-signed APKs only.
      - name: Unit tests, lint and debug build
        run: ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleDebug
